schema_version: 1

context:
  version: "1.6.3"

package:
  name: grunt
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/grunt/-/grunt-${{ version }}.tgz
  sha256: a4c86f1787007d1a72fdd6fa767fef7761f6f123fd8747a20740a269c89dbf72

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - grunt --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: "Grunt: The JavaScript Task Runner "
  description: |
    The JavaScript Task Runner
  homepage: https://github.com/gruntjs/grunt
  repository: https://github.com/gruntjs/grunt
  documentation: http://gruntjs.com/

extra:
  recipe-maintainers:
    - danielnachun
    - cshaley
    - sannykr
